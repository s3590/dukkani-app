version: '3.8'

services:
  # 1. حاوية تطبيق الويب والبوت
  web:
    build: .
    container_name: dukkani_web
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 2. حاوية قاعدة البيانات (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: dukkani_db
    restart: always
    environment:
      POSTGRES_USER: dukkani_user
      POSTGRES_PASSWORD: StrongPassword123
      POSTGRES_DB: dukkani_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukkani_user -d dukkani_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. حاوية الذاكرة المؤقتة والرادار (Redis)
  redis:
    image: redis:7-alpine
    container_name: dukkani_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

# إعداد مساحات التخزين الدائمة (لكي لا تضيع البيانات عند إعادة التشغيل)
volumes:
  pgdata:
  redisdata:
  
